name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Lectivo.slnx

      - name: Build (Release)
        run: dotnet build Lectivo.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/api/Lectivo.UnitTests -c Release --no-build --verbosity minimal

      # Los tests de integración usan Testcontainers (SQL Server); Docker está
      # disponible en los runners ubuntu-latest de GitHub.
      - name: Integration tests
        run: dotnet test tests/api/Lectivo.IntegrationTests -c Release --no-build --verbosity minimal
