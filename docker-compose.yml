services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lectivo-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Lectivo_Dev_2024!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Lectivo_Dev_2024!" -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lectivo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlserver-data:
  redis-data:
