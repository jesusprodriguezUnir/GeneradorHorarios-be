services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lectivo-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Lectivo_Dev_2024!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Lectivo_Dev_2024!" -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lectivo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API contenerizada (opt-in): docker compose --profile api up -d
  # En desarrollo normal la API se ejecuta con `dotnet run` fuera de Docker.
  api:
    build: .
    container_name: lectivo-api
    profiles: ["api"]
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=sql-server,1433;Database=Lectivo;User Id=sa;Password=Lectivo_Dev_2024!;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      sql-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  seq:
    image: datalust/seq:latest
    container_name: lectivo-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=Lectivo_Dev_2024!
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data

volumes:
  sqlserver-data:
  redis-data:
  seq-data:
